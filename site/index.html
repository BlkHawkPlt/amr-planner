<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IFR AMR Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14243b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMR Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-view="plan">
<header class="top noprint">
  <div class="brand"><span class="logo">✈</span><div><b>IFR AMR Planner</b><small id="missionLabel">New mission</small></div></div>
  <div class="actions">
    <button id="btnMissions" class="btn">Missions</button>
    <button id="btnPrint" class="btn pri">Print / PDF</button>
  </div>
</header>
<div class="disc noprint" id="discBar"><span class="cyc" id="cycBadge" title="FAA data cycle"></span> Training &amp; planning aid only. Verify all airport, procedure, frequency and weather data against current FAA publications before flight.</div>
<main>
  <section id="view-plan" class="view"></section>
  <section id="view-amr" class="view sheet"></section>
  <section id="view-175" class="view sheet"></section>
  <section id="view-1751" class="view sheet"></section>
  <section id="view-scripts" class="view"></section>
  <section id="view-info" class="view"></section>
</main>
<nav class="tabs noprint" id="tabs">
  <button data-tab="plan" class="on"><i>✎</i>Plan</button>
  <button data-tab="amr"><i>▤</i>AMR</button>
  <button data-tab="175"><i>▥</i>DD 175</button>
  <button data-tab="1751"><i>☁</i>175-1</button>
  <button data-tab="scripts"><i>✆</i>Scripts</button>
  <button data-tab="info"><i>ⓘ</i>Info</button>
</nav>
<div id="modal" class="modal noprint" hidden></div>
<div id="toast" class="toast noprint" hidden></div>
<script src="js/model.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>

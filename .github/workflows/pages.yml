name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:          # called by refresh.yml after it commits new FAA data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Playwright + Chromium
        run: |
          pip install playwright pymupdf
          playwright install --with-deps chromium
      - name: Tests (unit, data sanity, headless UI smoke)
        run: tests/ci.sh

  deploy:
    needs: test                     # a failing test skips the deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Stamp the release (service-worker cache, version.js, version.json) with the commit id
        run: |
          SHA=$(git rev-parse --short=8 HEAD)   # HEAD of main as checked out (GITHUB_SHA would be stale when called from refresh.yml)
          tools/stamp_release.sh site "$SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
